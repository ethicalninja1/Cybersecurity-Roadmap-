<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethical Ninja | Admin</title><link rel="stylesheet" href="/assets/style.css"><style>main{max-width:1050px;margin:6rem auto;padding:20px}.panel{padding:28px;border:1px solid #4b5563;border-radius:20px;background:rgba(80,80,80,.08)}input,textarea{display:block;width:100%;margin:10px 0;padding:14px;border-radius:8px;background:#171c26;color:white;border:1px solid #667085}textarea{height:60vh;font:13px/1.5 monospace}button{cursor:pointer;padding:12px 20px;margin:8px 8px 8px 0;border-radius:8px}#status{min-height:30px}</style></head><body><header class="nav"><a class="brand" href="/">⌘ ETHICAL<span>NINJA</span></a><div class="nav-actions"><a class="pill" href="/">← Website</a></div></header><main><div class="eyebrow">SECURE CONTENT MANAGEMENT</div><h1>ADMIN PANEL</h1><section id="login" class="panel"><h2>Sign in</h2><form id="loginForm"><input name="username" placeholder="Username" autocomplete="username" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="primary">Sign in</button></form></section><section id="editor" class="panel" hidden><h2>Roadmap Editor</h2><p>Edit six months as JSON. Each month requires 4 weeks. Changes publish to all visitors immediately.</p><textarea id="content" spellcheck="false"></textarea><button id="save" class="primary">Publish changes</button><button id="logout">Log out</button></section><p id="status" role="status"></p></main><script src="/assets/admin.js"></script></body></html>
